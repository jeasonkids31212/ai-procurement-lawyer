name: Auto Update Procurement Law Data

on:
  schedule:
    # 每天台灣時間凌晨 2:00 (UTC 18:00) 執行，符合司法院 0-6 點服務限制
    - cron: '0 18 * * *'
  workflow_dispatch: # 支援在 GitHub 上手動觸發執行

permissions:
  contents: write # 授權 Actions 可以寫入及 commit 回此倉庫

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch and preprocess script
        env:
          JUDICIAL_USER: ${{ secrets.JUDICIAL_USER }}
          JUDICIAL_PASS: ${{ secrets.JUDICIAL_PASS }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有新資料需要更新。"
          else
            git commit -m "auto: 雲端自動更新工程會解釋令與裁判書資料庫 [skip ci]"
            git push
          fi
